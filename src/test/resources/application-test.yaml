# 테스트 전용 설정 (@ActiveProfiles("test"))
# 개발 DB(ticketonline)에 테스트 회원·주문이 쌓이지 않도록 테스트 DB를 따로 쓴다.
# DB 비밀번호와 jwt.secret은 application.yaml 이 불러오는 application-secret.yaml 값을 그대로 쓴다.
spring:
  datasource:
    # 테스트 DB가 없으면 자동으로 만든다 (다른 PC에서도 따로 준비할 필요 없음)
    url: jdbc:mysql://localhost:3306/ticketonline_test?serverTimezone=Asia/Seoul&createDatabaseIfNotExist=true
  jpa:
    hibernate:
      # 테스트를 시작할 때 테이블을 새로 만들고 끝나면 지운다
      ddl-auto: create-drop
    # 동시성 테스트는 쿼리가 수천 개라 출력하지 않는다
    show-sql: false

  data:
    redis:
      # 개발용 대기열과 섞이지 않게 다른 번호의 DB 를 쓴다 (QueueServiceTest)
      database: 15

app:
  upload:
    dir: build/test-uploads
  queue:
    # 구매 테스트는 대기열을 건너뛴다. 대기열은 QueueServiceTest 에서 따로 확인
    enabled: false
