server:
  port:
    8888
spring:
  application:
    name: ticketonline
  config:
    # 실제 비밀번호는 GitHub에 올리지 않는 application-secret.yaml 에 적는다 (없으면 아래 기본값 사용)
    import: optional:classpath:application-secret.yaml
  datasource:
    url: jdbc:mysql://localhost:3306/ticketonline?serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # 화면은 API를 따로 불러 그리므로 요청이 끝나면 DB 연결을 바로 돌려준다
    open-in-view: false
  servlet:
    multipart:
      # 사진 1장 5MB 제한 (ImageService.MAX_BYTES와 같게)
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    redis:
      # 대기열 (C:\redis 에서 redis-server.exe redis.windows.conf 로 실행)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  upload:
    # 상품 사진 저장 폴더 (깃에 올리지 않음). 실행 위치 기준 상대 경로
    dir: ${UPLOAD_DIR:uploads}
  purchase:
    # 구매 동시성 처리 방식 (성능 비교용)
    # pessimistic: A 비관적 락 (SELECT ... FOR UPDATE) / optimistic: B 낙관적 락 (@Version, 최대 3번 시도)
    # redis: C Redis (Lua 스크립트로 한도·수량 확인과 차감을 한 번에, 통과한 요청만 DB 에 기록. Redis 가 켜져 있어야 함)
    # 기본은 C (k6 측정에서 가장 빠름). Redis 가 꺼져 있으면 구매도 실패한다
    strategy: ${PURCHASE_STRATEGY:redis}
  queue:
    # 구매하기 -> 대기열 -> 입장한 사람만 예매 화면에서 구매. k6 로 A/B/C 를 비교할 때는 false
    enabled: ${QUEUE_ENABLED:true}
    # 1초마다 앞에서부터 몇 명을 입장시킬지
    admit-per-second: ${QUEUE_ADMIT_PER_SECOND:50}
    # 입장한 뒤 예매 화면을 쓸 수 있는 시간
    admitted-seconds: 300
    # 이 시간 동안 순번 확인이 없으면 화면을 닫은 것으로 보고 줄에서 뺀다
    stale-seconds: 30
  load-test:
    # k6 부하 테스트 결과 폴더 (load-test/run.py 가 씀). 관리자 화면에서 보여준다. 실행 위치 기준 상대 경로
    results-dir: ${LOAD_TEST_RESULTS_DIR:load-test/results}

jwt:
  # 토큰 서명 비밀키(jwt.secret)는 application-secret.yaml 에만 적는다.
  # 없으면 서버가 "Could not resolve placeholder 'jwt.secret'" 오류로 시작하지 않는다.
  # 토큰 유효 시간: 2시간
  expiration-ms: 7200000
