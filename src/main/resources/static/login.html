<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 - 티켓온라인</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="logo" href="/"><img class="logo-img" src="/images/logo.svg" alt="TicketOnline 티켓온라인"></a>
      <nav class="gnb">
        <a href="/?type=TICKET">티켓</a>
        <a href="/?type=GOODS">굿즈</a>
      </nav>
      <nav class="nav"></nav>
    </div>
  </header>

  <main class="card">
    <h1>로그인</h1>
    <p class="card-sub">티켓온라인에 오신 것을 환영합니다</p>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">이메일</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit">로그인</button>
      <p class="message" id="message"></p>
    </form>
    <p class="footer-link">처음이신가요? <a href="/signup.html">회원가입</a></p>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const message = document.getElementById("message");

    /**
     * 로그인 후 돌아갈 곳 (?redirect=/product.html?id=7).
     * 다른 사이트로 보내는 주소("//evil.com", "https://...")는 막고 우리 사이트 경로만 허용한다.
     */
    function redirectTarget() {
      const target = new URLSearchParams(location.search).get("redirect");
      return target && target.startsWith("/") && !target.startsWith("//") && !target.startsWith("/\\") ? target : "/";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      try {
        const result = await api("/api/members/login", {
          method: "POST",
          body: { email: form.email.value.trim(), password: form.password.value },
        });
        auth.save(result);
        location.href = redirectTarget();
      } catch (e) {
        showMessage(message, e.message);
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
