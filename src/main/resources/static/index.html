<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>티켓온라인</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="logo" href="/"><img class="logo-img" src="/images/logo.svg" alt="TicketOnline 티켓온라인"></a>
      <nav class="gnb">
        <a href="/?type=TICKET">티켓</a>
        <a href="/?type=GOODS">굿즈</a>
      </nav>
      <nav class="nav"></nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <span class="hero-label">선착순 한정 판매</span>
      <h1>한정 수량, 공정한 선착순</h1>
      <p>티켓과 한정 굿즈를 정해진 수량만큼만, 누구에게나 공정하게.</p>
    </section>

    <!-- 종류 선택은 상단 메뉴(/?type=TICKET, /?type=GOODS)로 한다. 없으면 전체 -->
    <div class="section-head">
      <h2 id="list-title">전체 상품</h2>
    </div>

    <div class="loading" id="product-list">상품을 불러오는 중입니다...</div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/product-common.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
