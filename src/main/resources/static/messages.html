<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메시지함 - 티켓온라인</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="logo" href="/"><img class="logo-img" src="/images/logo.svg" alt="TicketOnline 티켓온라인"></a>
      <nav class="gnb">
        <a href="/?type=TICKET">티켓</a>
        <a href="/?type=GOODS">굿즈</a>
      </nav>
      <nav class="nav"></nav>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>메시지함</h1>
      <p>구매·취소·변경 알림과 상품 문의 쪽지를 모아 봅니다. 메시지를 누르면 읽음으로 바뀝니다.</p>
    </div>
    <div class="tabs message-tabs" id="message-tabs">
      <button type="button" class="tab" data-box="NOTICE">알림<em class="nav-count" hidden></em></button>
      <button type="button" class="tab" data-box="INBOX">받은 쪽지<em class="nav-count" hidden></em></button>
      <button type="button" class="tab" data-box="SENT">보낸 쪽지</button>
      <button type="button" class="btn-text read-all" id="read-all">모두 읽음</button>
    </div>
    <p class="message" id="page-message"></p>
    <div id="message-list"><p class="loading">메시지를 불러오는 중입니다...</p></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/product-common.js"></script>
  <script src="/js/messages.js"></script>
</body>
</html>
