<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>판매 관리 - 티켓온라인</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="logo" href="/"><img class="logo-img" src="/images/logo.svg" alt="TicketOnline 티켓온라인"></a>
      <nav class="gnb">
        <a href="/?type=TICKET">티켓</a>
        <a href="/?type=GOODS">굿즈</a>
      </nav>
      <nav class="nav"></nav>
    </div>
  </header>

  <main class="container">
  <div class="page-head">
    <h1>판매 관리</h1>
    <p>티켓과 굿즈를 등록하고, 판매 시작 전까지 수정할 수 있습니다.</p>
  </div>
  <div class="seller-layout">
    <section class="panel">
      <h2 id="form-title">상품 등록</h2>
      <form id="product-form" novalidate>
        <div class="field">
          <label>상품 종류</label>
          <div class="radio-group">
            <label><input type="radio" name="type" value="TICKET" checked> 티켓</label>
            <label><input type="radio" name="type" value="GOODS"> 굿즈</label>
          </div>
          <p class="hint" id="type-hint" hidden>종류는 등록 후 바꿀 수 없습니다.</p>
        </div>
        <h3 class="form-section">기본 정보</h3>
        <div class="field">
          <label for="title">상품명</label>
          <input id="title" maxlength="100" required>
        </div>
        <div class="field">
          <label for="image-file" id="image-label">대표 사진 (포스터)</label>
          <div class="image-picker" data-target="imageUrl">
            <img class="image-preview" alt="" hidden>
            <input id="image-file" type="file" accept="image/jpeg,image/png,image/webp">
            <button type="button" class="btn-small" data-action="clear-image" hidden>사진 빼기</button>
          </div>
          <p class="hint">jpg, png, webp / 5MB 이하 (선택)</p>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="saleStartAt">판매 시작</label>
            <input id="saleStartAt" type="datetime-local" required>
          </div>
          <div class="field">
            <label for="saleEndAt">판매 종료</label>
            <input id="saleEndAt" type="datetime-local" required>
          </div>
        </div>
        <div class="field">
          <label for="maxPerPerson">1인 구매 제한</label>
          <input id="maxPerPerson" type="number" min="1" required>
          <p class="hint" id="limit-hint">한 사람이 한 회차에서 살 수 있는 매수 (등급 합산)</p>
        </div>

        <!-- 티켓 -->
        <div id="ticket-fields">
          <h3 class="form-section">공연 정보</h3>
          <div class="field">
            <label for="venue">장소</label>
            <input id="venue" maxlength="200" placeholder="예: 올림픽공원 KSPO DOME">
          </div>
          <div class="field">
            <label for="seatmap-file">좌석 배치도</label>
            <div class="image-picker" data-target="seatMapUrl">
              <img class="image-preview" alt="" hidden>
              <input id="seatmap-file" type="file" accept="image/jpeg,image/png,image/webp">
              <button type="button" class="btn-small" data-action="clear-image" hidden>사진 빼기</button>
            </div>
          </div>
          <div class="field">
            <label>좌석 등급</label>
            <div class="row-list" id="grade-rows"></div>
            <button type="button" class="btn-small" id="add-grade">+ 등급 추가</button>
            <p class="hint">좌석 수는 모든 회차에 똑같이 적용됩니다. (최대 10개)</p>
          </div>
          <div class="field">
            <label>공연 회차</label>
            <div class="row-list" id="performance-rows"></div>
            <button type="button" class="btn-small" id="add-performance">+ 회차 추가</button>
            <p class="hint">판매 기간 안에 있어도 됩니다. (최대 20개)</p>
          </div>
          <div class="field">
            <label for="closeBeforeHours">회차별 예매 마감 (공연 시작 몇 시간 전)</label>
            <input id="closeBeforeHours" type="number" min="0" max="72" value="1">
            <p class="hint">회차마다 "공연 시작 N시간 전"과 "판매 종료" 중 이른 시각에 예매가 마감됩니다. (0~72)</p>
          </div>
        </div>

        <!-- 굿즈 -->
        <div id="goods-fields" hidden>
          <h3 class="form-section">굿즈 정보</h3>
          <div class="field-row">
            <div class="field">
              <label for="price">가격 (원)</label>
              <input id="price" type="number" min="0">
            </div>
            <div class="field">
              <label for="quantity">판매 수량</label>
              <input id="quantity" type="number" min="1">
            </div>
          </div>
          <div class="field">
            <label for="description">상품 설명</label>
            <textarea id="description" rows="4" maxlength="2000"></textarea>
          </div>
          <div class="field">
            <label for="deliveryType">수령 방법</label>
            <select id="deliveryType">
              <option value="PARCEL">택배</option>
              <option value="PICKUP">현장 수령</option>
            </select>
          </div>
        </div>

        <div style="height:12px"></div>
        <button class="btn" type="submit" id="submit-button">등록하기</button>
        <button class="btn btn-secondary" type="button" id="cancel-button" hidden>수정 취소</button>
        <p class="message" id="message"></p>
      </form>
    </section>

    <section class="panel">
      <h2>내 판매 상품</h2>
      <div id="product-list"></div>
    </section>
  </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/seller.js"></script>
</body>
</html>
