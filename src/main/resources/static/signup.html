<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 - 티켓온라인</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="/">티켓온라인</a>
    <nav class="nav"></nav>
  </header>

  <main class="card">
    <h1>회원가입</h1>
    <form id="signup-form" novalidate>
      <p class="hint">가입하면 한 계정으로 상품 구매와 판매를 모두 할 수 있습니다.</p>
      <div class="field">
        <label for="email">이메일</label>
        <input id="email" type="email" maxlength="100" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" type="password" minlength="8" maxlength="64" autocomplete="new-password" required>
        <p class="hint">8자 이상 64자 이하</p>
      </div>
      <div class="field">
        <label for="password-confirm">비밀번호 확인</label>
        <input id="password-confirm" type="password" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="name">이름</label>
        <input id="name" type="text" maxlength="50" autocomplete="name" required>
      </div>
      <button class="btn" type="submit">가입하기</button>
      <p class="message" id="message"></p>
    </form>
    <p class="footer-link">이미 계정이 있나요? <a href="/login.html">로그인</a></p>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById("signup-form");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = form.password.value;
      if (password !== document.getElementById("password-confirm").value) {
        showMessage(message, "비밀번호 확인이 일치하지 않습니다.");
        return;
      }

      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      try {
        await api("/api/members/signup", {
          method: "POST",
          body: {
            email: form.email.value.trim(),
            password,
            name: form.name.value.trim(),
          },
        });
        showMessage(message, "가입이 완료되었습니다. 로그인 화면으로 이동합니다.", "success");
        setTimeout(() => location.href = "/login.html", 1000);
      } catch (e) {
        showMessage(message, e.message);
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
